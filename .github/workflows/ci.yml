name: CI and Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture build metadata
        shell: bash
        run: |
          echo "TRAVEL_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_COMMIT_TIME=$(git log -1 --pretty=%cI)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
      - run: npm test
      - name: Run integration smoke test
        env:
          DATABASE_URL: postgres://travel:travel@127.0.0.1:5432/travel
          TRAVEL_AUTH_DISABLED: "1"
        run: node test/integration.mjs
      - name: Validate installer syntax
        run: bash -n deploy/install-server.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: test-password
          TRAVEL_ADMIN_PASSWORD: test-password
          TRAVEL_SESSION_SECRET: test-session-secret
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build Docker image
        run: |
          docker build -t travel:test \
            --build-arg TRAVEL_BUILD_COMMIT="$TRAVEL_BUILD_COMMIT" \
            --build-arg TRAVEL_BUILD_MESSAGE="$TRAVEL_BUILD_MESSAGE" \
            --build-arg TRAVEL_BUILD_COMMIT_TIME="$TRAVEL_BUILD_COMMIT_TIME" \
            --build-arg TRAVEL_BUILD_TIME="$TRAVEL_BUILD_TIME" .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture build metadata
        shell: bash
        run: |
          echo "TRAVEL_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_COMMIT_TIME=$(git log -1 --pretty=%cI)" >> "$GITHUB_ENV"
          echo "TRAVEL_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRAVEL_BUILD_COMMIT=${{ env.TRAVEL_BUILD_COMMIT }}
            TRAVEL_BUILD_MESSAGE=${{ env.TRAVEL_BUILD_MESSAGE }}
            TRAVEL_BUILD_COMMIT_TIME=${{ env.TRAVEL_BUILD_COMMIT_TIME }}
            TRAVEL_BUILD_TIME=${{ env.TRAVEL_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
