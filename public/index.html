<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>旅行计划</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="旅行计划" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <div class="brand-mark">旅</div>
      <h1>旅行计划</h1>
      <p>登录后编辑你的行程与待办。</p>
      <form id="login-form" class="stack">
        <label class="field">
          <span>访问密码</span>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="请输入访问密码" />
        </label>
        <button class="button primary full" type="submit">进入旅行计划</button>
      </form>
    </div>
  </section>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="back-home" class="icon-button hidden" type="button" aria-label="返回旅行列表">‹</button>
      <div class="topbar-copy">
        <div id="topbar-title" class="topbar-title">旅行计划</div>
      </div>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <main id="main" class="main"></main>

    <nav id="bottom-nav" class="bottom-nav hidden">
      <button data-tab="itinerary" class="nav-item active" type="button">
        <span class="nav-icon">⌁</span><span>行程</span>
      </button>
      <button data-tab="todos" class="nav-item" type="button">
        <span class="nav-icon">✓</span><span>待办</span>
      </button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-button" type="button" aria-label="关闭">×</button>
    </div>
    <form id="sheet-form" class="sheet-body"></form>
  </section>

  <script defer src="/app-core.js"></script>
  <script defer src="/app-render.js"></script>
  <script defer src="/app-forms.js"></script>
</body>
</html>
