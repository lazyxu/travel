<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>旅行计划</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="旅行计划" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="pwa-update" class="pwa-update hidden" role="status">
    <span>travel 有新版本</span>
    <button id="pwa-update-button" type="button">立即刷新</button>
  </div>

  <section id="login-view" class="login-view hidden">
    <div class="login-card">
      <div class="brand-mark">旅</div>
      <h1>旅行计划</h1>
      <p>登录后编辑你的行程与待办。</p>
      <form id="login-form" class="stack">
        <label class="field">
          <span>访问密码</span>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="请输入访问密码" />
        </label>
        <button class="button primary full" type="submit">进入旅行计划</button>
      </form>
    </div>
  </section>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="back-home" class="icon-button hidden" type="button" aria-label="返回旅行列表">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-copy">
        <div id="topbar-title" class="topbar-title">旅行计划</div>
      </div>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <main id="main" class="main"></main>

    <nav id="bottom-nav" class="bottom-nav hidden">
      <button data-tab="itinerary" class="nav-item active" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4.5 8.5h15M5 5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 5 5Z"/><path d="M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>
        </span>
        <span>行程</span>
      </button>
      <button data-tab="todos" class="nav-item" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 6h10M9 12h10M9 18h10"/><path d="m4 6 1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
        </span>
        <span>待办</span>
      </button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" aria-modal="true" role="dialog">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-button" type="button" aria-label="关闭">×</button>
    </div>
    <form id="sheet-form" class="sheet-body"></form>
  </section>

  <script defer src="/app-core.js"></script>
  <script defer src="/app-link-analyzer.js"></script>
  <script defer src="/app-order-analyzer.js"></script>
  <script defer src="/app-extra.js"></script>
  <script defer src="/app-render.js"></script>
  <script defer src="/app-item-editor.js"></script>
  <script defer src="/app-forms.js"></script>
</body>
</html>
